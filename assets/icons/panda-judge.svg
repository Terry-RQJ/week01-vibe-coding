<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="熊猫法官吉祥物">
  <!-- 地面影子 -->
  <ellipse cx="120" cy="246" rx="62" ry="9" fill="#9DB8A4" opacity="0.30"/>

  <!-- 法槌（右手举起） -->
  <g>
    <!-- 槌柄 -->
    <rect x="168" y="96" width="12" height="52" rx="6" fill="#B98A5A" stroke="#8A6238" stroke-width="3" transform="rotate(28 174 122)"/>
    <!-- 槌头（圆柱横放） -->
    <rect x="152" y="70" width="52" height="40" rx="16" fill="#C79A6B" stroke="#8A6238" stroke-width="4"/>
    <line x1="166" y1="72" x2="166" y2="108" stroke="#A87B4C" stroke-width="3"/>
    <line x1="190" y1="72" x2="190" y2="108" stroke="#A87B4C" stroke-width="3"/>
  </g>

  <!-- 举槌的手臂（黑） -->
  <path d="M 152 158 Q 176 148 186 128 Q 192 116 182 110 Q 172 104 164 116 Q 154 132 140 142 Z"
        fill="#2B2B2B"/>
  <!-- 手掌（黑圆爪） -->
  <circle cx="180" cy="112" r="14" fill="#2B2B2B"/>

  <!-- 法袍身体（圆梯形） -->
  <path d="M 120 138
           C 84 138 62 160 58 196
           C 55 220 62 238 78 238
           L 162 238
           C 178 238 185 220 182 196
           C 178 160 156 138 120 138 Z"
        fill="#2B2B2B" stroke="#1F1F1F" stroke-width="2"/>
  <!-- 法袍开襟（露出白衬衫） -->
  <path d="M 120 146 L 104 150 L 108 236 L 132 236 L 136 150 Z" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="1.5"/>
  <!-- 衬衫金色小扣 -->
  <circle cx="120" cy="172" r="3.5" fill="#D4A24C"/>
  <circle cx="120" cy="188" r="3.5" fill="#D4A24C"/>
  <circle cx="120" cy="204" r="3.5" fill="#D4A24C"/>

  <!-- 红色领结 -->
  <path d="M 120 146 L 100 136 L 100 158 Z" fill="#D0342C" stroke="#A8261F" stroke-width="2"/>
  <path d="M 120 146 L 140 136 L 140 158 Z" fill="#D0342C" stroke="#A8261F" stroke-width="2"/>
  <circle cx="120" cy="146" r="6" fill="#B8261F"/>

  <!-- 垂下的左臂（黑） -->
  <path d="M 66 168 Q 52 184 52 206 Q 52 218 64 218 Q 74 218 74 206 Q 74 188 82 176 Z" fill="#2B2B2B"/>
  <!-- 左手掌（黑圆爪，掌心向前） -->
  <circle cx="63" cy="216" r="13" fill="#2B2B2B"/>

  <!-- 头部（大圆，微微歪） -->
  <g transform="rotate(-4 120 92)">
    <!-- 耳朵 -->
    <circle cx="62" cy="44" r="24" fill="#2B2B2B"/>
    <circle cx="178" cy="44" r="24" fill="#2B2B2B"/>
    <!-- 脸 -->
    <circle cx="120" cy="88" r="72" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1.5"/>
    <!-- 眼圈 -->
    <ellipse cx="90" cy="82" rx="21" ry="24" fill="#2B2B2B"/>
    <ellipse cx="150" cy="82" rx="21" ry="24" fill="#2B2B2B"/>
    <!-- 眼珠 + 高光 -->
    <circle cx="94" cy="84" r="9" fill="#FFFFFF"/>
    <circle cx="146" cy="84" r="9" fill="#FFFFFF"/>
    <circle cx="96" cy="86" r="4.5" fill="#1A1A1A"/>
    <circle cx="144" cy="86" r="4.5" fill="#1A1A1A"/>
    <circle cx="92.5" cy="82.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="140.5" cy="82.5" r="1.8" fill="#FFFFFF"/>
    <!-- 鼻子 -->
    <ellipse cx="120" cy="102" rx="7" ry="5" fill="#2B2B2B"/>
    <!-- 微笑（W 形嘴，憨态） -->
    <path d="M 106 110 Q 113 120 120 112 Q 127 120 134 110" fill="none" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 张嘴小舌头 -->
    <path d="M 114 112 Q 120 121 126 112 Q 123 118 120 118 Q 117 118 114 112 Z" fill="#E8837A"/>
    <!-- 腮红 -->
    <ellipse cx="66" cy="102" rx="11" ry="7" fill="#F5B8B4" opacity="0.85"/>
    <ellipse cx="174" cy="102" rx="11" ry="7" fill="#F5B8B4" opacity="0.85"/>
  </g>

  <!-- 胸前小徽章：迷你法槌图案 -->
  <circle cx="86" cy="192" r="13" fill="#4A7C59" stroke="#3A6247" stroke-width="2"/>
  <rect x="82" y="186" width="10" height="7" rx="2.5" fill="#FFFFFF"/>
  <rect x="86" y="192" width="2.5" height="8" rx="1" fill="#FFFFFF"/>
</svg>
