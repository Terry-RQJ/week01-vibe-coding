<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="法律小科普轻站吉祥物：熊猫律师">
  <!-- 律师假发（白色卷曲，包裹头顶） -->
  <g fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5">
    <ellipse cx="100" cy="55" rx="60" ry="30"/>
    <circle cx="55" cy="60" r="16"/>
    <circle cx="75" cy="42" r="14"/>
    <circle cx="100" cy="38" r="14"/>
    <circle cx="125" cy="42" r="14"/>
    <circle cx="145" cy="60" r="16"/>
  </g>
  <!-- 圆脸（米黄宣纸色） -->
  <ellipse cx="100" cy="108" rx="56" ry="52" fill="#FBF7EE" stroke="#374151" stroke-width="2"/>
  <!-- 熊猫耳朵（黑色 + 灰色内耳） -->
  <ellipse cx="50" cy="82" rx="17" ry="20" fill="#1F2937"/>
  <ellipse cx="150" cy="82" rx="17" ry="20" fill="#1F2937"/>
  <ellipse cx="50" cy="82" rx="8" ry="10" fill="#4B5563"/>
  <ellipse cx="150" cy="82" rx="8" ry="10" fill="#4B5563"/>
  <!-- 黑眼圈（斜椭圆） -->
  <ellipse cx="78" cy="103" rx="14" ry="17" fill="#1F2937" transform="rotate(-15 78 103)"/>
  <ellipse cx="122" cy="103" rx="14" ry="17" fill="#1F2937" transform="rotate(15 122 103)"/>
  <!-- 眼珠（白色高光 + 黑瞳） -->
  <circle cx="80" cy="101" r="5" fill="#FFFFFF"/>
  <circle cx="120" cy="101" r="5" fill="#FFFFFF"/>
  <circle cx="80" cy="102" r="2.5" fill="#111827"/>
  <circle cx="120" cy="102" r="2.5" fill="#111827"/>
  <!-- 鼻子 -->
  <ellipse cx="100" cy="128" rx="6" ry="4" fill="#1F2937"/>
  <!-- 微笑嘴 -->
  <path d="M 88 142 Q 100 152 112 142" stroke="#1F2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 蓝色西装 V 领 -->
  <path d="M 65 158 L 100 142 L 135 158 L 135 200 L 65 200 Z" fill="#1E40AF"/>
  <!-- 白色衬衫领口 -->
  <path d="M 88 142 L 100 156 L 112 142 L 112 162 L 88 162 Z" fill="#FFFFFF"/>
  <!-- 蓝色领带 -->
  <path d="M 96 156 L 104 156 L 106 170 L 102 192 L 98 192 L 94 170 Z" fill="#1E3A8A"/>
  <!-- 朱红"法"字印章 -->
  <circle cx="100" cy="182" r="13" fill="#C8102E"/>
  <text x="100" y="188" font-size="15" font-weight="700" fill="#FBF7EE" text-anchor="middle" font-family="serif">法</text>
</svg>