<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="法律小科普轻站吉祥物：熊猫律师">
  <!-- 头组（微微歪 3° 显得活泼） -->
  <g transform="rotate(-3 100 110)">
    <!-- 律师假发（波浪卷曲 + 多层） -->
    <g fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2">
      <!-- 底层假发 -->
      <ellipse cx="100" cy="58" rx="62" ry="32"/>
      <!-- 卷曲小球（多个不规则位置） -->
      <circle cx="48" cy="60" r="14"/>
      <circle cx="60" cy="44" r="13"/>
      <circle cx="78" cy="38" r="13"/>
      <circle cx="100" cy="34" r="14"/>
      <circle cx="122" cy="38" r="13"/>
      <circle cx="140" cy="44" r="13"/>
      <circle cx="152" cy="60" r="14"/>
      <circle cx="38" cy="72" r="10"/>
      <circle cx="162" cy="72" r="10"/>
      <circle cx="68" cy="28" r="10"/>
      <circle cx="132" cy="28" r="10"/>
      <!-- 卷曲高光线条 -->
      <path d="M 75 42 Q 80 50 88 45" stroke="#F3F4F6" stroke-width="1" fill="none"/>
      <path d="M 110 38 Q 118 46 126 42" stroke="#F3F4F6" stroke-width="1" fill="none"/>
      <path d="M 95 32 Q 100 40 105 32" stroke="#F3F4F6" stroke-width="1" fill="none"/>
    </g>
    <!-- 头（圆脸，米白色） -->
    <ellipse cx="100" cy="110" rx="56" ry="52" fill="#FBF7EE" stroke="#374151" stroke-width="2"/>
    <!-- 耳朵（黑色椭圆 + 灰色内耳） -->
    <ellipse cx="48" cy="82" rx="20" ry="22" fill="#1F2937"/>
    <ellipse cx="152" cy="82" rx="20" ry="22" fill="#1F2937"/>
    <ellipse cx="48" cy="82" rx="10" ry="11" fill="#4B5563"/>
    <ellipse cx="152" cy="82" rx="10" ry="11" fill="#4B5563"/>
    <!-- 黑眼圈（更大更萌） -->
    <ellipse cx="78" cy="105" rx="16" ry="19" fill="#1F2937"/>
    <ellipse cx="122" cy="105" rx="16" ry="19" fill="#1F2937"/>
    <!-- 眼珠（白色高光 + 视线对着用户） -->
    <circle cx="80" cy="103" r="6.5" fill="#FFFFFF"/>
    <circle cx="120" cy="103" r="6.5" fill="#FFFFFF"/>
    <!-- 黑色瞳仁（视线略向下，萌感） -->
    <circle cx="81" cy="105" r="3.8" fill="#111827"/>
    <circle cx="121" cy="105" r="3.8" fill="#111827"/>
    <!-- 眼珠高光小白点 -->
    <circle cx="82.5" cy="103" r="1.5" fill="#FFFFFF"/>
    <circle cx="122.5" cy="103" r="1.5" fill="#FFFFFF"/>
    <!-- 眉毛（淡墨弯月） -->
    <path d="M 64 78 Q 76 70 88 78" stroke="#374151" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 112 78 Q 124 70 136 78" stroke="#374151" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 腮红（朱红小圆，半透明） -->
    <ellipse cx="62" cy="130" rx="9" ry="5" fill="#C8102E" opacity="0.45"/>
    <ellipse cx="138" cy="130" rx="9" ry="5" fill="#C8102E" opacity="0.45"/>
    <!-- 鼻子 -->
    <ellipse cx="100" cy="128" rx="6" ry="4.5" fill="#1F2937"/>
    <!-- 嘴（上扬微笑弧线） -->
    <path d="M 86 142 Q 100 156 114 142" stroke="#1F2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 小舌头（朱红） -->
    <ellipse cx="100" cy="150" rx="3" ry="2" fill="#C8102E"/>
  </g>
  <!-- 蓝色西装 V 领 -->
  <path d="M 65 160 L 100 144 L 135 160 L 135 220 L 65 220 Z" fill="#1E40AF"/>
  <!-- 白色衬衫领口 -->
  <path d="M 88 144 L 100 158 L 112 144 L 112 164 L 88 164 Z" fill="#FFFFFF"/>
  <!-- 蓝色领带 -->
  <path d="M 96 158 L 104 158 L 106 174 L 102 196 L 98 196 L 94 174 Z" fill="#1E3A8A"/>
  <!-- 朱红"法"字印章 -->
  <circle cx="100" cy="186" r="13" fill="#C8102E"/>
  <text x="100" y="192" font-size="15" font-weight="700" fill="#FBF7EE" text-anchor="middle" font-family="serif">法</text>
  <!-- 一只小手"举手打招呼"（从头部右上角伸出） -->
  <g transform="translate(165 90)">
    <!-- 蓝色袖子 -->
    <path d="M -8 12 Q -10 32 0 36 L 14 36 Q 22 32 16 12 Z" fill="#1E40AF"/>
    <!-- 黑色熊猫手掌（圆） -->
    <circle cx="6" cy="0" r="12" fill="#1F2937"/>
    <!-- 4 个手指 -->
    <ellipse cx="0" cy="-10" rx="3" ry="6" fill="#1F2937"/>
    <ellipse cx="6" cy="-13" rx="3" ry="6" fill="#1F2937"/>
    <ellipse cx="12" cy="-13" rx="3" ry="6" fill="#1F2937"/>
    <ellipse cx="18" cy="-10" rx="3" ry="6" fill="#1F2937"/>
    <!-- 手掌肉垫（米色暗示） -->
    <ellipse cx="6" cy="2" rx="5" ry="3" fill="#FBF7EE" opacity="0.4"/>
  </g>
</svg>