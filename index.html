<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的网站 · 建设中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      margin-bottom: 24px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    p {
      font-size: 15px;
      line-height: 1.9;
      opacity: 0.9;
      margin-bottom: 12px;
    }

    .steps {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 14px;
      text-align: left;
      opacity: 0.85;
    }

    .steps li {
      list-style: none;
      padding: 7px 0;
    }

    .steps li::before {
      content: "✓";
      margin-right: 10px;
      font-weight: bold;
    }

    footer {
      margin-top: 28px;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">DAY 2 · 占位页</div>
    <h1>网站正在建设中 🚧</h1>
    <p>这是项目的第一版占位页，用来验证代码已经成功上传到 GitHub。</p>
    <p>真正的功能会在后面几天逐步加上来。</p>

    <ul class="steps">
      <li>本地项目初始化完成</li>
      <li>首个 HTML 文件已创建</li>
      <li>忽略规则已配置（密钥文件不会上传）</li>
    </ul>

    <footer>第一周 · 第 2 天</footer>
  </main>
</body>
</html>
