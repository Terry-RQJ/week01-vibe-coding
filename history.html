<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="法律小科普轻站：浏览记录。看看最近学过哪些情形。">
  <meta name="theme-color" content="#1B3524">
  <title>浏览记录 · 法律小科普轻站</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/global.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="./index.html" class="brand" aria-label="法律小科普轻站 回到首页">🎋 法律小科普轻站</a>
      <a href="./index.html" class="nav-link" aria-label="首页">首页</a>
      <a href="./bookmarks.html" class="nav-link" aria-label="我的收藏">我的收藏</a>
      <a href="./history.html" class="nav-link" aria-label="浏览记录" aria-current="page">浏览记录</a>
    </div>
  </header>

  <main style="position: relative; z-index: 1;">
    <div class="container">
      <nav class="breadcrumbs" aria-label="面包屑导航">
        <a href="./index.html">首页</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page">浏览记录</span>
      </nav>

      <section aria-labelledby="hist-h" style="padding-top: var(--space-3);">
        <div class="toolbar">
          <h1 id="hist-h" class="section-title">浏览记录</h1>
          <div class="state-demo">
            <label for="state-demo-select">状态演示：</label>
            <select id="state-demo-select">
              <option value="success" selected>成功</option>
              <option value="loading">加载中</option>
              <option value="empty">空</option>
              <option value="error">错误</option>
            </select>
          </div>
        </div>
        <p style="font-size: var(--font-size-sm); color: var(--bamboo-dark); margin-bottom: var(--space-3);">最近看过的情形（最新在最上面，进详情页自动记录）。</p>
        <div id="card-area" style="display: grid; grid-template-columns: 1fr; gap: var(--space-4);">
          <!-- 四种状态由 js/page-history.js 渲染 -->
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <div><strong>免责声明 ·</strong> 本站内容由 <strong>AI 起草 + 律师人工复核</strong>，仅供学习参考，<strong>不构成具体法律咨询</strong>。您的具体问题请咨询执业律师，或拨打免费法律服务热线 <strong>12348</strong>。</div>
      <div><strong>紧急情况 ·</strong> 人身安全事件请立即拨打 <strong>110</strong>。</div>
      <div class="meta">本站为个人学习项目 · Day 13 多视图 · 2026-09-28</div>
    </div>
  </footer>

  <noscript>
    <div style="padding: 16px; background: var(--color-warn-bg); color: var(--color-warn-fg); text-align: center;">本站依赖 JavaScript 才能正常使用详情、收藏与历史功能。</div>
  </noscript>

  <script src="./data/cards.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/page-history.js"></script>
  <script>
    /* 演示器（首页也有，规则一致）：切换替换 demoState 参数，进页时回显当前状态 */
    var demoSelect = document.getElementById("state-demo-select");
    if (demoSelect) {
      var mState = location.search.match(/demoState=(loading|error)/);
      if (mState) demoSelect.value = mState[1];
      demoSelect.addEventListener("change", function () {
        var s = demoSelect.value;
        var q = location.search.replace(/[?&]demoState=[^&]+/g, "");
        if (s === "loading" || s === "error") q += (q.indexOf("?") >= 0 ? "&" : "?") + "demoState=" + s;
        location.search = q;
      });
    }
  </script>
</body>
</html>
